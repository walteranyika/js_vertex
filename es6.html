    let details = ["John", "Miriam"]

    //default param
    function divide(a, b, rounded = false) {
        let res = a / b
        if (rounded === true) {
            return Math.round(res)
        }
        return res
    }

    let res1 = divide(10, 3, true)
    let res2 = divide(10, 3)

    console.log(res1, res2)

    //spread operator
    function flexibleAdd(...nums) {
        let total = 0
        for (let value of nums) {
            total += value
        }
        return total
    }

    console.log(flexibleAdd(10, 20, 30, 10))

    let people = ["Jill", "Jack", "Doe"]
